[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "message-version-bundle-builder"
version = "0.1.0"
description = "Build validated 0-9 context versions from one canonical message."
requires-python = ">=3.11"
license = {file = "LICENSE.md"}

[project.scripts]
message-version-bundle-builder = "message_version_bundle.cli:main"

[tool.setuptools.packages.find]
include = ["message_version_bundle*"]
